[project]
name = "ds-heat-exposure"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "dask>=2026.8.0",
    "ecmwf-datastores-client>=0.6.0",
    "exactextract>=0.3.0",
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.2",
    "netcdf4<1.7.5",
    "numpy>=2.5.4",
    "ocha-stratus>=0.1.9",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rasterio>=1.4,<1.5",
    "rioxarray>=0.23.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
